<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <title>Account actions</title>
  </head>
  <body>
    <main>
      <p>Signed in as <strong>alain@example.com</strong></p>
      <label for="email">Email address</label>
      <input class="email-input" id="email" name="email" type="email" />
      <div class="actions">
        <button class="icon-button" aria-label="Edit profile">✎</button>
        <button class="icon-button" aria-label="Delete profile">×</button>
      </div>
      <button class="save-button">Save changes</button>
    </main>
  </body>
</html>
